name: Validate Kait images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_accelerators:
        description: Enable inactive NVIDIA, AMD, and Intel host jobs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.hardware }}-${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - hardware: cpu
            variant: slim
            runner: ubuntu-24.04
            platform: linux/amd64
            base_image: ubuntu:24.04
            python_bin: python3
            capabilities: data-science
            smoke: true
          - hardware: cpu
            variant: full
            runner: ubuntu-24.04
            platform: linux/amd64
            base_image: ubuntu:24.04
            python_bin: python3
            capabilities: data-science,training,orchestration,serving
            smoke: true
          - hardware: apple
            variant: slim
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            base_image: ubuntu:24.04
            python_bin: python3
            capabilities: data-science
            smoke: true
          - hardware: apple
            variant: full
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            base_image: ubuntu:24.04
            python_bin: python3
            capabilities: data-science,training,orchestration,serving
            smoke: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate bake graph
        if: matrix.hardware == 'cpu' && matrix.variant == 'slim'
        run: docker buildx bake --print
      - name: Build and boot image contract
        env:
          HARDWARE: ${{ matrix.hardware }}
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
          BASE_IMAGE: ${{ matrix.base_image }}
          PYTHON_BIN: ${{ matrix.python_bin }}
          CAPABILITIES: ${{ matrix.capabilities }}
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform "${PLATFORM}" \
            --tag "kait:ci-${HARDWARE}-${VARIANT}" \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg BUILDKITE_AGENT_VERSION=3.123.1 \
            --build-arg KAIT_HARDWARE="${HARDWARE}" \
            --build-arg KAIT_VARIANT="${VARIANT}" \
            --build-arg KAIT_CAPABILITIES="${CAPABILITIES}" \
            --build-arg KAIT_PYTHON="${PYTHON_BIN}" \
            --provenance=false \
            --sbom=false \
            .
          docker run --rm --platform "${PLATFORM}" "kait:ci-${HARDWARE}-${VARIANT}" doctor
      - name: Run native framework smoke test
        if: matrix.smoke
        env:
          HARDWARE: ${{ matrix.hardware }}
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
        run: docker run --rm --platform "${PLATFORM}" -e KAIT_HARDWARE="${HARDWARE}" -e KAIT_VARIANT="${VARIANT}" "kait:ci-${HARDWARE}-${VARIANT}" smoke

  build-accelerators:
    name: Build inactive accelerator ${{ matrix.hardware }}-${{ matrix.variant }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_accelerators == true }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # These labels are deliberately inactive until matching hosts are registered.
          - hardware: nvidia
            variant: slim
            runner: kait-nvidia
            platform: linux/amd64
            base_image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
            python_bin: python3
            capabilities: data-science
          - hardware: nvidia
            variant: full
            runner: kait-nvidia
            platform: linux/amd64
            base_image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
            python_bin: python3
            capabilities: data-science,training,orchestration,serving
          - hardware: amd
            variant: slim
            runner: kait-amd
            platform: linux/amd64
            base_image: rocm/dev-ubuntu-24.04:6.2.4-complete
            python_bin: python3
            capabilities: data-science
          - hardware: amd
            variant: full
            runner: kait-amd
            platform: linux/amd64
            base_image: rocm/dev-ubuntu-24.04:6.2.4-complete
            python_bin: python3
            capabilities: data-science,training,orchestration,serving
          - hardware: intel
            variant: slim
            runner: kait-intel
            platform: linux/amd64
            base_image: intel/oneapi-basekit:2025.0.1-0-devel-ubuntu22.04
            python_bin: python3.11
            capabilities: data-science
          - hardware: intel
            variant: full
            runner: kait-intel
            platform: linux/amd64
            base_image: intel/oneapi-basekit:2025.0.1-0-devel-ubuntu22.04
            python_bin: python3.11
            capabilities: data-science,training,orchestration,serving
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke inactive accelerator image
        env:
          HARDWARE: ${{ matrix.hardware }}
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
          BASE_IMAGE: ${{ matrix.base_image }}
          PYTHON_BIN: ${{ matrix.python_bin }}
          CAPABILITIES: ${{ matrix.capabilities }}
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform "${PLATFORM}" \
            --tag "kait:ci-${HARDWARE}-${VARIANT}" \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg BUILDKITE_AGENT_VERSION=3.123.1 \
            --build-arg KAIT_HARDWARE="${HARDWARE}" \
            --build-arg KAIT_VARIANT="${VARIANT}" \
            --build-arg KAIT_CAPABILITIES="${CAPABILITIES}" \
            --build-arg KAIT_PYTHON="${PYTHON_BIN}" \
            --provenance=false \
            --sbom=false \
            .
          docker run --rm --platform "${PLATFORM}" "kait:ci-${HARDWARE}-${VARIANT}" doctor
          docker run --rm --platform "${PLATFORM}" -e KAIT_HARDWARE="${HARDWARE}" -e KAIT_VARIANT="${VARIANT}" "kait:ci-${HARDWARE}-${VARIANT}" smoke
