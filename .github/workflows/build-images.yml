name: Validate Kait images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_accelerators:
        description: Enable inactive NVIDIA, AMD, and Intel host jobs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Resolve capability matrix
    runs-on: ubuntu-24.04
    outputs:
      containers: ${{ steps.matrix.outputs.containers }}
      native: ${{ steps.matrix.outputs.native }}
      accelerators: ${{ steps.matrix.outputs.accelerators }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "containers=$(go run ./cmd/kait matrix --active-only --runtime container | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "native=$(go run ./cmd/kait matrix --active-only --runtime native-macos | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "accelerators=$(go run ./cmd/kait matrix --accelerators-only | tr -d '\n')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.hardware }}-${{ matrix.profile }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.containers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Bake graph
        if: matrix.hardware == 'cpu' && matrix.profile == 'slim'
        run: docker buildx bake --print cpu-slim
      - name: Build image from the capability contract
        env:
          IMAGE: kait:ci-${{ matrix.hardware }}-${{ matrix.profile }}
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform "${{ matrix.platform }}" \
            --tag "${IMAGE}" \
            --build-arg BASE_IMAGE="${{ matrix.base_image }}" \
            --build-arg BUILDKITE_AGENT_VERSION=3.123.1 \
            --build-arg KAIT_VERSION=ci \
            --build-arg KAIT_HARDWARE="${{ matrix.hardware }}" \
            --build-arg KAIT_VARIANT="${{ matrix.variant }}" \
            --build-arg KAIT_PROFILE="${{ matrix.profile }}" \
            --build-arg KAIT_CAPABILITIES="${{ matrix.capabilities }}" \
            --build-arg KAIT_PYTHON="${{ matrix.python_bin }}" \
            --provenance=false \
            --sbom=false \
            .
          docker run --rm --platform "${{ matrix.platform }}" "${IMAGE}" doctor
          docker run --rm --platform "${{ matrix.platform }}" "${IMAGE}" smoke

  build-native:
    name: Build native ${{ matrix.hardware }}-${{ matrix.profile }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and smoke native Apple MPS worker
        env:
          PROFILE: ${{ matrix.profile }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == "Darwin" && "$(uname -m)" == "arm64" ]]
          go build -trimpath -o "$RUNNER_TEMP/kait" ./cmd/kait
          go run ./cmd/kait contract --hardware apple --profile "$PROFILE" > "$RUNNER_TEMP/identity.json"
          jq -e '.schema == 3 and .runtime == "native-macos" and .accelerator == "mps"' "$RUNNER_TEMP/identity.json" >/dev/null
          sudo mkdir -p "/Library/Application Support/Kait"
          sudo cp "$RUNNER_TEMP/identity.json" "/Library/Application Support/Kait/identity.json"
          python3 -m venv "$RUNNER_TEMP/kait-venv"
          "$RUNNER_TEMP/kait-venv/bin/pip" install --upgrade pip
          while IFS= read -r manifest; do
            "$RUNNER_TEMP/kait-venv/bin/pip" install -r "requirements/$manifest"
          done < <(jq -r '.requirements[]' "$RUNNER_TEMP/identity.json")
          export PATH="$RUNNER_TEMP/kait-venv/bin:$PATH"
          "$RUNNER_TEMP/kait" doctor
          "$RUNNER_TEMP/kait" smoke

  build-accelerators:
    name: Build accelerator ${{ matrix.hardware }}-${{ matrix.profile }}
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_accelerators == true }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.accelerators) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke matching accelerator image
        env:
          IMAGE: kait:ci-${{ matrix.hardware }}-${{ matrix.profile }}
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform "${{ matrix.platform }}" \
            --tag "${IMAGE}" \
            --build-arg BASE_IMAGE="${{ matrix.base_image }}" \
            --build-arg BUILDKITE_AGENT_VERSION=3.123.1 \
            --build-arg KAIT_VERSION=ci \
            --build-arg KAIT_HARDWARE="${{ matrix.hardware }}" \
            --build-arg KAIT_VARIANT="${{ matrix.variant }}" \
            --build-arg KAIT_PROFILE="${{ matrix.profile }}" \
            --build-arg KAIT_CAPABILITIES="${{ matrix.capabilities }}" \
            --build-arg KAIT_PYTHON="${{ matrix.python_bin }}" \
            --provenance=false \
            --sbom=false \
            .
          docker run --rm --platform "${{ matrix.platform }}" "${IMAGE}" doctor
          docker run --rm --platform "${{ matrix.platform }}" "${IMAGE}" smoke
