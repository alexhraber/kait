name: Validate Kaite images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - hardware: cpu
            runner: ubuntu-24.04
            platform: linux/amd64
            base_image: ubuntu:24.04
            python_bin: python3
            smoke: true
          - hardware: apple
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            base_image: ubuntu:24.04
            python_bin: python3
            smoke: true
          - hardware: nvidia
            runner: kaite-nvidia
            platform: linux/amd64
            base_image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
            python_bin: python3
            smoke: true
          - hardware: amd
            runner: kaite-amd
            platform: linux/amd64
            base_image: rocm/dev-ubuntu-24.04:6.2.4-complete
            python_bin: python3
            smoke: true
          - hardware: intel
            runner: kaite-intel
            platform: linux/amd64
            base_image: intel/oneapi-basekit:2025.0.1-0-devel-ubuntu22.04
            python_bin: python3.11
            smoke: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate bake graph
        if: matrix.hardware == 'cpu'
        run: docker buildx bake --print
      - name: Build and boot image contract
        env:
          HARDWARE: ${{ matrix.hardware }}
          PLATFORM: ${{ matrix.platform }}
          BASE_IMAGE: ${{ matrix.base_image }}
          PYTHON_BIN: ${{ matrix.python_bin }}
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform "${PLATFORM}" \
            --tag "kaite:ci-${HARDWARE}" \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg BUILDKITE_AGENT_VERSION=3.123.1 \
            --build-arg KAITE_HARDWARE="${HARDWARE}" \
            --build-arg KAITE_PYTHON="${PYTHON_BIN}" \
            --provenance=false \
            --sbom=false \
            .
          docker run --rm --platform "${PLATFORM}" "kaite:ci-${HARDWARE}" doctor
      - name: Run native framework smoke test
        if: matrix.smoke
        env:
          HARDWARE: ${{ matrix.hardware }}
          PLATFORM: ${{ matrix.platform }}
        run: docker run --rm --platform "${PLATFORM}" -e KAITE_HARDWARE="${HARDWARE}" "kaite:ci-${HARDWARE}" smoke
