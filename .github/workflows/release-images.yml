name: Release Kaite images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v1.2.3
        required: true
        type: string
      publish_stable:
        description: Refresh the stable hardware aliases
        required: true
        default: false
        type: boolean
      enable_accelerators:
        description: Publish inactive NVIDIA, AMD, and Intel images on matching hosts
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.hardware }}-${{ matrix.variant }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - hardware: cpu
            variant: slim
            runner: ubuntu-24.04
            platforms: linux/amd64
            base_image: ubuntu:24.04
            python_bin: python3
          - hardware: cpu
            variant: full
            runner: ubuntu-24.04
            platforms: linux/amd64
            base_image: ubuntu:24.04
            python_bin: python3
          - hardware: apple
            variant: slim
            runner: ubuntu-24.04-arm
            platforms: linux/arm64
            base_image: ubuntu:24.04
            python_bin: python3
          - hardware: apple
            variant: full
            runner: ubuntu-24.04-arm
            platforms: linux/arm64
            base_image: ubuntu:24.04
            python_bin: python3

    steps:
      - uses: actions/checkout@v4

      - name: Set release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_STABLE: ${{ inputs.publish_stable }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          publish_stable="${INPUT_PUBLISH_STABLE:-true}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_stable=$publish_stable" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kaite
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}-${{ matrix.hardware }}-${{ matrix.variant }}
            type=raw,value=${{ matrix.hardware }}-${{ matrix.variant }},enable=${{ steps.release.outputs.publish_stable == 'true' }}
            type=raw,value=${{ steps.release.outputs.version }}-${{ matrix.hardware }},enable=${{ matrix.variant == 'slim' }}
            type=raw,value=${{ matrix.hardware }},enable=${{ matrix.variant == 'slim' && steps.release.outputs.publish_stable == 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BUILDKITE_AGENT_VERSION=3.123.1
            KAITE_HARDWARE=${{ matrix.hardware }}
            KAITE_VARIANT=${{ matrix.variant }}
            KAITE_PYTHON=${{ matrix.python_bin }}

      - name: Smoke published image on the matching host
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kaite
          HARDWARE: ${{ matrix.hardware }}
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platforms }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          image="${IMAGE_PREFIX}:${version}-${HARDWARE}-${VARIANT}"
          docker pull --platform "${PLATFORM%%,*}" "$image"
          KAITE_IMAGE="$image" \
            KAITE_HARDWARE="$HARDWARE" \
            KAITE_VARIANT="$VARIANT" \
            KAITE_O11Y=none \
            KAITE_CONTAINER_COMMAND=smoke \
            ./deploy/docker/run.sh

  verify:
    name: Verify published manifests
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - hardware: cpu
            variant: slim
            platform: linux/amd64
          - hardware: apple
            variant: slim
            platform: linux/arm64
          - hardware: cpu
            variant: full
            platform: linux/amd64
          - hardware: apple
            variant: full
            platform: linux/arm64
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Log in to GHCR for verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect versioned manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kaite
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          image="${IMAGE_PREFIX}:${version}-${{ matrix.hardware }}-${{ matrix.variant }}"
          docker buildx imagetools inspect "$image"
          docker pull --platform "${PLATFORM}" "$image"
          docker run --rm --platform "${PLATFORM}" "$image" doctor

  publish-accelerators:
    name: Publish inactive accelerator ${{ matrix.hardware }}-${{ matrix.variant }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_accelerators == true }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # These labels are deliberately inactive until matching hosts are registered.
          - hardware: nvidia
            variant: slim
            runner: kaite-nvidia
            platforms: linux/amd64
            base_image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
            python_bin: python3
          - hardware: nvidia
            variant: full
            runner: kaite-nvidia
            platforms: linux/amd64
            base_image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
            python_bin: python3
          - hardware: amd
            variant: slim
            runner: kaite-amd
            platforms: linux/amd64
            base_image: rocm/dev-ubuntu-24.04:6.2.4-complete
            python_bin: python3
          - hardware: amd
            variant: full
            runner: kaite-amd
            platforms: linux/amd64
            base_image: rocm/dev-ubuntu-24.04:6.2.4-complete
            python_bin: python3
          - hardware: intel
            variant: slim
            runner: kaite-intel
            platforms: linux/amd64
            base_image: intel/oneapi-basekit:2025.0.1-0-devel-ubuntu22.04
            python_bin: python3.11
          - hardware: intel
            variant: full
            runner: kaite-intel
            platforms: linux/amd64
            base_image: intel/oneapi-basekit:2025.0.1-0-devel-ubuntu22.04
            python_bin: python3.11
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kaite:${{ steps.release.outputs.version }}-${{ matrix.hardware }}-${{ matrix.variant }}
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BUILDKITE_AGENT_VERSION=3.123.1
            KAITE_HARDWARE=${{ matrix.hardware }}
            KAITE_VARIANT=${{ matrix.variant }}
            KAITE_PYTHON=${{ matrix.python_bin }}
      - name: Smoke published inactive accelerator image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kaite:${{ steps.release.outputs.version }}-${{ matrix.hardware }}-${{ matrix.variant }}
          HARDWARE: ${{ matrix.hardware }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          KAITE_IMAGE="$IMAGE" KAITE_HARDWARE="$HARDWARE" KAITE_VARIANT="$VARIANT" KAITE_O11Y=none \
            KAITE_CONTAINER_COMMAND=smoke ./deploy/docker/run.sh

  github-release:
    # Release Please already creates the GitHub Release for semantic tags.
    # Do not fail the matrix after images publish: annotate with GHCR pull lines
    # (works for tag push and workflow_dispatch). Never use `gh release edit
    # --generate-notes` — that flag is create-only and breaks re-runs.
    name: Annotate GitHub release with image tags
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Point release notes at published GHCR tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          image="ghcr.io/${OWNER}/kaite"
          section_file=$(mktemp)
          cat >"$section_file" <<EOF

          ### Container images

          Published to \`${image}\` (provenance + SBOM on each tag):

          | Tag | Use |
          | --- | --- |
          | \`${image}:${version}-cpu-slim\` | CPU slim (\`linux/amd64\`) |
          | \`${image}:${version}-cpu-full\` | CPU full (\`linux/amd64\`) |
          | \`${image}:${version}-apple-slim\` | Apple Silicon slim (\`linux/arm64\`) |
          | \`${image}:${version}-apple-full\` | Apple Silicon full (\`linux/arm64\`) |
          | \`${image}:cpu-slim\` / \`cpu-full\` / \`apple-slim\` / \`apple-full\` | Stable aliases (latest release) |

          \`\`\`bash
          docker pull ${image}:${version}-cpu-slim
          \`\`\`
          EOF
          # Drop the accidental leading indentation from the heredoc body.
          section=$(sed 's/^          //' "$section_file")

          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            body=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json body -q .body)
            if [[ "$body" == *"### Container images"* ]]; then
              echo "Release $version already documents container images"
              exit 0
            fi
            notes=$(mktemp)
            printf '%s\n%s\n' "$body" "$section" >"$notes"
            gh release edit "$version" --repo "$GITHUB_REPOSITORY" \
              --title "Kaite $version" \
              --notes-file "$notes"
          else
            notes=$(mktemp)
            printf 'Kaite %s\n%s\n' "$version" "$section" >"$notes"
            gh release create "$version" --repo "$GITHUB_REPOSITORY" \
              --title "Kaite $version" \
              --notes-file "$notes" \
              --verify-tag
          fi
