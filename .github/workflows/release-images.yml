name: Release Kait images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v1.2.3
        required: true
        type: string
      publish_stable:
        description: Refresh stable profile aliases
        required: true
        default: false
        type: boolean
      enable_accelerators:
        description: Publish inactive NVIDIA, AMD, and Intel profiles on matching hosts
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  plan:
    name: Resolve release capability matrix
    runs-on: ubuntu-24.04
    outputs:
      containers: ${{ steps.matrix.outputs.containers }}
      native: ${{ steps.matrix.outputs.native }}
      accelerators: ${{ steps.matrix.outputs.accelerators }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: matrix
        shell: bash
        env:
          ENABLE_ACCELERATORS: ${{ inputs.enable_accelerators }}
        run: |
          set -euo pipefail
          echo "containers=$(go run ./cmd/kait matrix --active-only --runtime container | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "native=$(go run ./cmd/kait matrix --active-only --runtime native-macos | tr -d '\n')" >> "$GITHUB_OUTPUT"
          if [[ "${ENABLE_ACCELERATORS:-false}" == "true" ]]; then
            echo "accelerators=$(go run ./cmd/kait matrix --accelerators-only | tr -d '\n')" >> "$GITHUB_OUTPUT"
          else
            echo 'accelerators={"include":[]}' >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.hardware }}-${{ matrix.profile }} image
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.containers) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_STABLE: ${{ inputs.publish_stable }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          publish_stable="${INPUT_PUBLISH_STABLE:-true}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "runtime_version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "publish_stable=$publish_stable" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kait
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}-${{ matrix.hardware }}-${{ matrix.profile }}
            type=raw,value=${{ matrix.hardware }}-${{ matrix.profile }},enable=${{ steps.release.outputs.publish_stable == 'true' }}
            type=raw,value=${{ steps.release.outputs.version }}-${{ matrix.hardware }},enable=${{ matrix.profile == 'slim' }}
            type=raw,value=${{ matrix.hardware }},enable=${{ matrix.profile == 'slim' && steps.release.outputs.publish_stable == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ join(matrix.platforms, ',') }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BUILDKITE_AGENT_VERSION=3.123.1
            KAIT_VERSION=${{ steps.release.outputs.runtime_version }}
            KAIT_HARDWARE=${{ matrix.hardware }}
            KAIT_VARIANT=${{ matrix.variant }}
            KAIT_PROFILE=${{ matrix.profile }}
            KAIT_CAPABILITIES=${{ matrix.capabilities }}
            KAIT_PYTHON=${{ matrix.python_bin }}
      - name: Smoke published profile on its native runner
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kait:${{ steps.release.outputs.version }}-${{ matrix.hardware }}-${{ matrix.profile }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker pull --platform "${PLATFORM}" "${IMAGE}"
          docker run --rm --platform "${PLATFORM}" "${IMAGE}" doctor
          docker run --rm --platform "${PLATFORM}" "${IMAGE}" smoke

  publish-native:
    name: Publish native ${{ matrix.hardware }}-${{ matrix.profile }} bundle
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.native) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "runtime_version=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Package and smoke native Apple MPS worker
        env:
          PROFILE: ${{ matrix.profile }}
          VERSION: ${{ steps.release.outputs.version }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == "Darwin" && "$(uname -m)" == "arm64" ]]
          bundle="$RUNNER_TEMP/kait-${VERSION}-apple-${PROFILE}.tar.gz"
          ./deploy/macos/package.sh --profile "$PROFILE" --version "$VERSION" --output "$bundle"
          mkdir -p "$RUNNER_TEMP/kait-bundle"
          tar -xzf "$bundle" -C "$RUNNER_TEMP/kait-bundle"
          "$RUNNER_TEMP/kait-bundle/install.sh"
          export PATH="/opt/kait/venv/bin:$PATH"
          /usr/local/bin/kait doctor
          /usr/local/bin/kait smoke
      - uses: actions/upload-artifact@v4
        with:
          name: kait-apple-${{ matrix.profile }}
          path: ${{ runner.temp }}/kait-${{ steps.release.outputs.version }}-apple-${{ matrix.profile }}.tar.gz
          if-no-files-found: error

  verify:
    name: Verify released ${{ matrix.hardware }}-${{ matrix.profile }} manifest
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.containers) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect and smoke immutable profile tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kait
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          image="${IMAGE_PREFIX}:${version}-${{ matrix.hardware }}-${{ matrix.profile }}"
          docker buildx imagetools inspect "$image"
          docker pull --platform "${{ matrix.platform }}" "$image"
          docker run --rm --platform "${{ matrix.platform }}" "$image" doctor

  publish-accelerators:
    name: Publish accelerator ${{ matrix.hardware }}-${{ matrix.profile }} image
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_accelerators == true }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.accelerators) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "runtime_version=${version#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kait:${{ steps.release.outputs.version }}-${{ matrix.hardware }}-${{ matrix.profile }}
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BUILDKITE_AGENT_VERSION=3.123.1
            KAIT_VERSION=${{ steps.release.outputs.runtime_version }}
            KAIT_HARDWARE=${{ matrix.hardware }}
            KAIT_VARIANT=${{ matrix.variant }}
            KAIT_PROFILE=${{ matrix.profile }}
            KAIT_CAPABILITIES=${{ matrix.capabilities }}
            KAIT_PYTHON=${{ matrix.python_bin }}
      - name: Smoke published accelerator profile
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kait:${{ steps.release.outputs.version }}-${{ matrix.hardware }}-${{ matrix.profile }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" doctor
          docker run --rm --platform linux/amd64 "$IMAGE" smoke

  github-release:
    name: Annotate GitHub release with profile images
    needs: [verify, publish-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts
          pattern: kait-apple-*
          merge-multiple: true
      - name: Point release notes at published GHCR profiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          image="ghcr.io/${OWNER}/kait"
          section=$(cat <<EOF

          ### Container profiles

          Published to \`${image}\` with provenance and SBOM:

          - \`${image}:${version}-<hardware>-slim\` and \`-full\` compatibility profiles
          - \`${image}:${version}-<hardware>-data-science\`
          - \`${image}:${version}-<hardware>-training\`
          - \`${image}:${version}-<hardware>-orchestration\`
          - \`${image}:${version}-<hardware>-serving\`

          Native Apple GPU profiles are uploaded as
          \`kait-${version}-apple-<profile>.tar.gz\` release assets. They run on
          native macOS arm64 hosts and validate PyTorch MPS access.
          EOF
          )
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            body=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json body -q .body)
            if [[ "$body" != *"### Container profiles"* ]]; then
              gh release edit "$version" --repo "$GITHUB_REPOSITORY" --notes "${body}${section}"
            fi
          fi
      - name: Upload native Apple MPS bundles to the GitHub release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          mapfile -t bundles < <(find native-artifacts -type f -name '*.tar.gz' -print)
          [[ "${#bundles[@]}" -gt 0 ]]
          gh release upload "$version" "${bundles[@]}" --repo "$GITHUB_REPOSITORY" --clobber
