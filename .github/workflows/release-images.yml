name: Release Kaite images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v1.2.3
        required: true
        type: string
      publish_stable:
        description: Refresh the stable hardware aliases
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.hardware }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - hardware: cpu
            runner: ubuntu-24.04
            platforms: linux/amd64,linux/arm64
            base_image: ubuntu:24.04
            python_bin: python3
          - hardware: apple
            runner: ubuntu-24.04-arm
            platforms: linux/arm64
            base_image: ubuntu:24.04
            python_bin: python3
          - hardware: nvidia
            runner: kaite-nvidia
            platforms: linux/amd64
            base_image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
            python_bin: python3
          - hardware: amd
            runner: kaite-amd
            platforms: linux/amd64
            base_image: rocm/dev-ubuntu-24.04:6.2.4-complete
            python_bin: python3
          - hardware: intel
            runner: kaite-intel
            platforms: linux/amd64
            base_image: intel/oneapi-basekit:2025.0.1-0-devel-ubuntu22.04
            python_bin: python3.11

    steps:
      - uses: actions/checkout@v4

      - name: Set release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_STABLE: ${{ inputs.publish_stable }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          publish_stable="${INPUT_PUBLISH_STABLE:-true}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_stable=$publish_stable" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for CPU multi-platform release
        if: matrix.hardware == 'cpu'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kaite
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}-${{ matrix.hardware }}
            type=raw,value=${{ matrix.hardware }},enable=${{ steps.release.outputs.publish_stable == 'true' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BUILDKITE_AGENT_VERSION=3.123.1
            KAITE_HARDWARE=${{ matrix.hardware }}
            KAITE_PYTHON=${{ matrix.python_bin }}

      - name: Smoke published image on the matching host
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kaite
          HARDWARE: ${{ matrix.hardware }}
          PLATFORM: ${{ matrix.platforms }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          image="${IMAGE_PREFIX}:${version}-${HARDWARE}"
          docker pull --platform "${PLATFORM%%,*}" "$image"
          KAITE_IMAGE="$image" \
            KAITE_HARDWARE="$HARDWARE" \
            KAITE_O11Y=none \
            KAITE_CONTAINER_COMMAND=smoke \
            ./deploy/docker/run.sh

  verify:
    name: Verify published manifests
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - hardware: cpu
            platform: linux/amd64
          - hardware: apple
            platform: linux/arm64
          - hardware: nvidia
            platform: linux/amd64
          - hardware: amd
            platform: linux/amd64
          - hardware: intel
            platform: linux/amd64
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Log in to GHCR for verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect versioned manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kaite
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME}}"
          [[ "$version" == v* ]] || version="v$version"
          docker buildx imagetools inspect "${IMAGE_PREFIX}:${version}-${{ matrix.hardware }}"
          docker pull --platform "${PLATFORM}" "${IMAGE_PREFIX}:${version}-${{ matrix.hardware }}"
          docker run --rm --platform "${PLATFORM}" "${IMAGE_PREFIX}:${version}-${{ matrix.hardware }}" doctor
