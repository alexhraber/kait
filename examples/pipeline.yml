env:
  KAIT_O11Y: prometheus

steps:
  - label: ":mag: CPU unit tests"
    command: "kait smoke"
    agents:
      queue: ai
      kait: "true"
      kait.hardware: cpu
      kait.variant: slim
      kait.capability.data-science: "true"

  - label: ":brain: CPU training environment"
    command: "python train.py"
    agents:
      queue: ai
      kait: "true"
      kait.hardware: cpu
      kait.capability.training: "true"

  - label: ":apple: Apple Silicon serving environment"
    command: "kait smoke"
    agents:
      queue: ai
      kait: "true"
      kait.hardware: apple
      kait.variant: full
      kait.capability.serving: "true"

  # Accelerator hosts are manual opt-in (inactive in default CI/release):
