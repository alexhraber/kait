env:
  KAITE_O11Y: prometheus

steps:
  - label: ":mag: CPU unit tests"
    command: "kaite smoke"
    agents:
      queue: ai
      kaite: "true"
      kaite.hardware: cpu
      kaite.variant: slim
      kaite.capability.data-science: "true"

  - label: ":brain: CPU training environment"
    command: "python train.py"
    agents:
      queue: ai
      kaite: "true"
      kaite.hardware: cpu
      kaite.capability.training: "true"

  - label: ":apple: Apple Silicon serving environment"
    command: "kaite smoke"
    agents:
      queue: ai
      kaite: "true"
      kaite.hardware: apple
      kaite.variant: full
      kaite.capability.serving: "true"

  # Accelerator hosts are manual opt-in (inactive in default CI/release):
