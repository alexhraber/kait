env:
  KAITE_O11Y: prometheus

steps:
  - label: ":mag: CPU unit tests"
    command: "kaite smoke"
    agents:
      queue: ai
      kaite: "true"
      kaite.hardware: cpu
      kaite.variant: slim

  - label: ":apple: Apple Silicon evaluation"
    command: "kaite smoke"
    agents:
      queue: ai
      kaite: "true"
      kaite.hardware: apple
      kaite.variant: full

  # Accelerator hosts are manual opt-in (inactive in default CI/release):
