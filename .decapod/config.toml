schema_version = "1.0.0"

[init]
specs = true
ci = true
diagram_style = "ascii"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]

[repo]
product_name = "kait"
product_summary = "Self-hosted Buildkite agents packaged with a portable AI/ML runtime: pinned agent, slim/full Python toolchains, hardware image contracts, and collector-friendly metrics for CPU and Apple Silicon (with opt-in NVIDIA/AMD/Intel paths)."
architecture_direction = "infra"
product_type = "service_or_library"
done_criteria = "Versioned CPU and Apple images register as Buildkite agents or job environments with validated AI tooling, accelerator detection, telemetry, and process supervision; automated builds, smoke tests, docs, and examples are sufficient to deploy without modifying the base image. Accelerator paths remain explicit opt-ins."
base_branch = "main"
primary_languages = ["Go"]
detected_surfaces = [
    "go",
    "shell",
]
external_tracker = false
container_workspaces = true
backend = "local"
declared_capabilities = [
    "authentication",
    "background-processing",
    "event-driven",
    "external-integrations",
    "infrastructure-management",
    "persistent-state",
    "public-api",
    "secrets-handling",
]

[governance]
protected_paths = []
approval_categories = ["destructive_operations"]

[proof]
commands = []

[repo.migration_validation]
command = "decapod"
args = ["activate"]
working_directory = "."
timeout_seconds = 60

[custody]
isolation = "container"

[tracker]
provider = "decapod"

[context]
declared_sources = ["AGENTS.md"]
